<section class="formulario-contacto">
  <h2>Formulario de Contacto</h2>
  <form action="#" method="post">
    <label for="contact-name">Nombre completo</label>
    <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" required>
    <label for="contact-email">Correo electrónico</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="Tu correo electrónico" required>
    <label for="contact-message">Mensaje</label>
    <textarea id="contact-message" name="message" rows="5" placeholder="Tu mensaje" required></textarea>
    <button type="submit" class="btn-primary">Enviar</button>
  </form>
</section>
